name: CI
# Named rather than defaulted (T76, D-037). `[push, pull_request]` with no
# filter runs the matrix on every branch and on every tag, which made a tag
# push a second reading of bytes that had just been read - an accident rather
# than a position, in a repository whose consumer refuses the same thing
# deliberately under D-S57.
#
# The tag run is kept, and that is the decision rather than the leftover.
# `actions/checkout` resolves the ref it was given, so a tag run asks a
# question the commit run cannot: does the tree this tag points at pass. Under
# a release procedure whose rule is "tag on the full commit hash, never HEAD",
# a tag on the wrong commit is the failure that run catches, and it is the only
# check in this project that can catch it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the supported range, plus the version development and
        # the release gates actually run on. Until 0.37.0.0 the comment above
        # this line claimed 3.12 was covered and the matrix did not contain
        # it, so every "gate green" in a release note was a reading CI never
        # took. The claim and the matrix now say the same thing.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # CI calls the single gate. It does not restate its steps.
      #
      # It used to. Until 0.4.0.0 this file also carried `hygiene`, `docs-audit`
      # and `manual-audit` as separate jobs, restating three checks that `verify`
      # already runs, in a repository whose README says CI does not do that. The
      # jobs were added when each check was, which is exactly how the drift in
      # ENGINEERING.md section 2 happens: a check added in one place and mirrored
      # in another, until the two disagree and the weaker one is what runs.
      - run: make verify
      # Digests are deliberately outside `verify` (F101): they describe a
      # commit, and a working tree under edit is supposed to differ from one.
      # Here the tree is a checkout of a pushed commit, so the question is both
      # answerable and worth asking - this is where a release that skipped
      # `make manifest-write` becomes visible to somebody other than whoever
      # forgot.
      - run: make manifest
