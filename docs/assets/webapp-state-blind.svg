<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>MAVO web tier, blind</title>
  <rect width="900" height="560" fill="#12151a"/>
  <rect x="0" y="0" width="900" height="56" fill="#1a1f26"/>
  <text x="24" y="27" fill="#e6e9ee" font-size="15" font-weight="700">MAVO</text>
  <text x="24" y="45" fill="#8b95a3" font-size="11">To nie jest serwis państwowy. Narzędzie raportuje obraz, nie przewiduje przekroczenia granicy.</text>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#2a323c"/>
  <rect x="24" y="76" width="852" height="46" rx="4" fill="#1a1f26" stroke="#c9a227" stroke-width="2"/>
  <circle cx="48" cy="99" r="7" fill="#c9a227"/>
  <text x="66" y="97" fill="#e6e9ee" font-size="14" font-weight="700">Zbieranie danych nie działa</text>
  <text x="66" y="114" fill="#8b95a3" font-size="11">Ostatnia obserwacja: nieznana · feed: blind · strona nie wie, co dzieje się teraz</text>
  <rect x="24" y="140" width="470" height="300" rx="4" fill="#1a1f26" stroke="#2a323c"/>
  <text x="40" y="162" fill="#8b95a3" font-size="11">Zachodnia Ukraina, rejony deklarujące alarm</text>
  <rect x="60" y="180" width="120" height="90" fill="#5b2a2f" stroke="#2a323c"/>
  <text x="68" y="196" fill="#8b95a3" font-size="9">Wołyńska</text>
  <rect x="190" y="180" width="130" height="90" fill="#2a1e22" stroke="#2a323c"/>
  <text x="198" y="196" fill="#8b95a3" font-size="9">Rówieńska</text>
  <rect x="60" y="280" width="120" height="90" fill="#5b2a2f" stroke="#2a323c"/>
  <text x="68" y="296" fill="#8b95a3" font-size="9">Lwowska</text>
  <rect x="190" y="280" width="130" height="90" fill="#2a1e22" stroke="#2a323c"/>
  <text x="198" y="296" fill="#8b95a3" font-size="9">Tarnopolska</text>
  <rect x="330" y="180" width="140" height="190" fill="#2a1e22" stroke="#2a323c"/>
  <text x="338" y="196" fill="#8b95a3" font-size="9">Zakarpacka</text>
  <line x1="48" y1="180" x2="48" y2="370" stroke="#4a545f" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="30" y="390" fill="#8b95a3" font-size="9" transform="rotate(-90 30 390)">granica PL</text>
  <text x="40" y="428" fill="#8b95a3" font-size="10">Warstwa alarmów wygaszona: brak danych to nie brak alarmu.</text>
  <rect x="510" y="140" width="366" height="300" rx="4" fill="#1a1f26" stroke="#2a323c"/>
  <text x="526" y="162" fill="#8b95a3" font-size="11">Odległość do granicy, przedział</text>
  <text x="526" y="428" fill="#8b95a3" font-size="10">Nic nie jest wyświetlane jako spokojne, bo nic nie jest znane.</text>
  <text x="560" y="320" fill="#c9a227" font-size="13" font-weight="700">Brak danych</text>
  <text x="560" y="342" fill="#8b95a3" font-size="11">Ostatni zapis starszy niż okno ważności.</text>
  <rect x="0" y="516" width="900" height="44" fill="#1a1f26"/>
  <line x1="0" y1="516" x2="900" y2="516" stroke="#2a323c"/>
  <text x="24" y="542" fill="#8b95a3" font-size="11">Makieta, nie zrzut ekranu. Stan blind jest osobnym komunikatem, nigdy pustą listą.</text>
</svg>
