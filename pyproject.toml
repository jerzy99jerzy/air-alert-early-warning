[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-alert-early-warning"
version = "0.10.1.0"
description = "Cross-border early warning from Ukrainian air-alert feeds, with an explicit base-rate gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mavo = "mavo.cli:main"

[tool.setuptools.packages.find]
include = ["mavo*"]

[tool.setuptools.package-data]
# The area map is a versioned artifact the package reads at runtime. Without
# this it resolves nothing once installed, and the failure is silent: classify
# falls back to the oblast table that scores 0 of 20 (F23).
mavo = ["../data/reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["mavo"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Verbatim source data, not code. Reflowing these strings to satisfy a line
# limit would edit the evidence the measurement was taken against.
"tests/fixtures/real_messages.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
